---
metadata:
  labels:
    name: configiq-batch-summarization-rag
    description: |
      Batch summarization and RAG. Catalog bimodal input is approximated with bounded normal sampling; normal output is preserved. One request per conversation.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    extras:
      body:
        temperature: 0.0
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: false
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 15000
    prompt_tokens_stdev: 22000
    prompt_tokens_min: 1000
    prompt_tokens_max: 80000
    output_tokens: 500
    output_tokens_stdev: 300
    output_tokens_min: 50
    output_tokens_max: 2000
    prefix_count: 1
    prefix_tokens: 500
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 275
