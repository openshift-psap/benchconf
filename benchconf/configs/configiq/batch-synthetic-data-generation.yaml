---
metadata:
  labels:
    name: configiq-batch-synthetic-data-generation
    description: |
      Synthetic data generation. Catalog lognormal input is approximated with bounded normal sampling. Uniform output keeps the 500-8000 bounds; its midpoint is 4250 rather than the catalog stated mean of 4000.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    extras:
      body:
        temperature: 0.7
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: false
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 500
    prompt_tokens_stdev: 1200
    prompt_tokens_min: 50
    prompt_tokens_max: 15000
    output_tokens: 4000
    output_tokens_min: 500
    output_tokens_max: 8000
    prefix_count: 1
    prefix_tokens: 2000
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 275
