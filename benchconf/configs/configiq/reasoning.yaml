---
metadata:
  labels:
    name: configiq-reasoning
    description: |
      Deep thinking. Catalog lognormal input and exponential output are approximated with bounded normal sampling. One request per conversation.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    extras:
      body:
        temperature: 0.6
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: false
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 1000
    prompt_tokens_stdev: 800
    prompt_tokens_min: 100
    prompt_tokens_max: 5000
    output_tokens: 8000
    output_tokens_stdev: 6500
    output_tokens_min: 500
    output_tokens_max: 32000
    prefix_count: 1
    prefix_tokens: 250
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 275
