---
metadata:
  labels:
    name: configiq-deep-research
    description: |
      Deep research agent. Catalog config.json has exponential opening input and bimodal output; GuideLLM synthetic_text approximates both with bounded normal sampling. Variable turns are represented by 15 fixed turns.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    extras:
      body:
        temperature: 0.1
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: false
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 3000
    prompt_tokens_stdev: 2500
    prompt_tokens_min: 500
    prompt_tokens_max: 15000
    first_prompt_tokens: 45000
    first_prompt_tokens_stdev: 35000
    first_prompt_tokens_min: 2000
    first_prompt_tokens_max: 150000
    output_tokens: 300
    output_tokens_stdev: 850
    output_tokens_min: 50
    output_tokens_max: 4000
    turns: 15
    delay: 25
    delay_stdev: 12
    delay_min: 5
    delay_max: 60
    prefix_count: 1
    prefix_tokens: 2000
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 1800
