---
metadata:
  labels:
    name: configiq-default
    description: |
      Default single-turn text-generation baseline with 2K input and 128-token output.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: false
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 2048
    output_tokens: 128
    turns: 1
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 275
