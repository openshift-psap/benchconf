---
metadata:
  labels:
    name: configiq-code-generation
    description: |
      Long-context coding-agent scenario with a 160K opening prompt and a 540-turn conversation.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    extras:
      body:
        temperature: 0.2
  profile:
    kind: knee
    initial_streams: [1, 2, 5, 25, 50, 100, 200, 300]
    adaptive: true
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 1500
    prompt_tokens_stdev: 1200
    prompt_tokens_min: 100
    prompt_tokens_max: 10000
    first_prompt_tokens: 160000
    first_prompt_tokens_stdev: 233600
    first_prompt_tokens_min: 10000
    first_prompt_tokens_max: 990000
    output_tokens: 425
    output_tokens_stdev: 825
    output_tokens_min: 50
    output_tokens_max: 10000
    turns: 540
    delay: 15
    delay_stdev: 55
    delay_min: 1
    delay_max: 1000
    prefix_count: 1
    prefix_tokens: 3000
  seed:
    kind: static
    value: 42
  constraints:
  - kind: max_duration
    seconds: 21600
