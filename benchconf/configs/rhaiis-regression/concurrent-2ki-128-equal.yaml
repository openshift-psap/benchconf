---
metadata:
  labels:
    name: concurrent-2ki-128-equal
    description: |
      Prefill heavy scenario.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 2048
    output_tokens: 128
  constraints:
  - kind: max_duration
    seconds: 275
benchmarks:
- profile.streams: 1
- profile.streams: 50
- profile.streams: 100
- profile.streams: 200
- profile.streams: 300
