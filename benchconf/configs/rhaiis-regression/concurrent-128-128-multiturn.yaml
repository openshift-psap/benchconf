---
metadata:
  labels:
    name: concurrent-128-128-multiturn
    description: |
      Multi-turn conversation scenario with prefix caching.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 128
    output_tokens: 128
    turns: 5
    prefix_buckets:
    - prefix_count: 10000
      prefix_tokens: 512
  constraints:
  - kind: max_duration
    seconds: 275
benchmarks:
- profile.streams: 1
- profile.streams: 32
- profile.streams: 64
- profile.streams: 128
- profile.streams: 256
- profile.streams: 512
