# Unified PSAP inference suite.
# Supersedes llm-d/<old-name> and rhaiis-regression/<old-name> (see README).
metadata:
  labels:
    name: concurrent-1k-1k-equal
    description: 'Balanced prefill/decode scenario: 1000 prompt tokens, 1000 output
      tokens.'
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    warmup: 75
    rampup_duration: 35
  data:
  - kind: synthetic_text
    prompt_tokens: 1000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 275
benchmarks:
- profile.streams: 1
- profile.streams: 50
- profile.streams: 100
- profile.streams: 200
- profile.streams: 300
