---
metadata:
  labels:
    name: concurrent-1k-1k-equal
    description: |
      Prefill/Decode balanced scenario.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    request_timeout: 1000
  profile:
    kind: concurrent
    max_concurrency: 1000
  data:
  - kind: synthetic_text
    prompt_tokens: 1000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 450
benchmarks:
- profile.streams: 1
- profile.streams: 50
- profile.streams: 100
- profile.streams: 200
- profile.streams: 300
