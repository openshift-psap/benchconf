---
metadata:
  labels:
    name: concurrent-100k-1k-equal
    description: |
      Very large context scenario.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    request_timeout: 1000
  profile:
    kind: concurrent
    max_concurrency: 1000
  data:
  - kind: synthetic_text
    prompt_tokens: 100000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 450
  - kind: samples
    count: 10
benchmarks:
- profile.streams: 1
- profile.streams: 2
- profile.streams: 5
