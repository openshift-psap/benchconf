---
metadata:
  labels:
    name: concurrent-8k-1k
    description: |
      Large-context scenario aligned with RHAIIS profile 4.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
    rampup_duration: 35
    warmup: 75
  data:
  - kind: synthetic_text
    prompt_tokens: 8000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 275
benchmarks:
- profile.streams: 1
- profile.streams: 25
- profile.streams: 50
- profile.streams: 75
- profile.streams: 100
