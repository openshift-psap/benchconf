---
metadata:
  labels:
    name: smoke
    description: |
      Minimal smoke test: a handful of requests at concurrency 1 to verify
      the inference endpoint is functional. Finishes in under a minute.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
  data:
  - kind: synthetic_text
    prompt_tokens: 128
    output_tokens: 128
  constraints:
  - kind: max_requests
    value: 10
benchmarks:
- profile.streams: 1
