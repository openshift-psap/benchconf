# DEPRECATED: the 'llm-d' suite is superseded by 'psap-inference'.
# See README.md for the mapping. Removal planned once consumers migrate.
---
metadata:
  labels:
    name: heavy-load
    description: |
      Very large context scenario aligned with RHAIIS profile 5.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
    rampup_duration: 35
    warmup: 75
  data:
  - kind: synthetic_text
    prompt_tokens: 100000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 275
benchmarks:
- profile.streams: 1
- profile.streams: 2
- profile.streams: 5
