---
metadata:
  labels:
    name: concurrent-512-2ki-norm
    description: |
      Generation heavy scenario with sequence length variance.

      Note: This scenario is optimized for NVIDIA H200s and may need to be adjusted for other hardware.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
  data:
  - kind: synthetic_text
    prompt_tokens: 512
    prompt_tokens_stdev: 128
    prompt_tokens_min: 1
    prompt_tokens_max: 1024
    output_tokens: 2048
    output_tokens_stdev: 512
    output_tokens_min: 1
    output_tokens_max: 4096
  constraints:
  - kind: max_duration
    seconds: 600
benchmarks:
- profile.streams: 1
- profile.streams: 5
- profile.streams: 25
- profile.streams: 50
- profile.streams: 100
- profile.streams: 150
- profile.streams: 200
- profile.streams: 250
- profile.streams: 300
- profile.streams: 400
- profile.streams: 500
- profile.streams: 650
