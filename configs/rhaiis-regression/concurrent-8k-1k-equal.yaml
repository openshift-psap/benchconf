---
metadata:
  labels:
    name: concurrent-8k-1k-equal
    description: |
      Large context scenario.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
  data:
  - kind: synthetic_text
    prompt_tokens: 8000
    output_tokens: 1000
  constraints:
  - kind: max_duration
    seconds: 450
benchmarks:
- profile.streams: 1
- profile.streams: 50
- profile.streams: 100
- profile.streams: 200
- profile.streams: 300
