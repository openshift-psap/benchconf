---
metadata:
  labels:
    name: concurrent-1k-1k-multiturn
    description: |
      Multi-turn conversation scenario with prefix caching.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
    request_timeout: 1000
  profile:
    kind: concurrent
    max_concurrency: 1000
  data:
  - kind: synthetic_text
    prompt_tokens: 1000
    output_tokens: 1000
    turns: 5
    prefix_tokens: 512
    prefix_count: 10
  constraints:
  - kind: max_duration
    seconds: 450
benchmarks:
- profile.streams: 1
- profile.streams: 25
- profile.streams: 50
- profile.streams: 75
- profile.streams: 100
