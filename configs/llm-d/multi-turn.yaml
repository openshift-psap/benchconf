---
metadata:
  labels:
    name: multi-turn
    description: |
      Multi-turn conversation scenario with prefix caching.
      Requires min_max_model_len >= 40960 on the serving side.
spec:
  backend:
    kind: "openai_http"
    request_format: "/v1/chat/completions"
  profile:
    kind: concurrent
  data:
  - kind: synthetic_text
    prompt_tokens: 128
    output_tokens: 128
    turns: 5
    prefix_tokens: 10000
    prefix_count: 1024  # ideally it should be 2*concurrency
  constraints:
  - kind: max_requests
    count: [320, 640, 1280, 2560, 5120]
benchmarks:
- profile.streams: 32
- profile.streams: 64
- profile.streams: 128
- profile.streams: 256
- profile.streams: 512
