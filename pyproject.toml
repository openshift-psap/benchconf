[project]
name = "benchconf"
version = "0.1.0"
description = "Standard benchmark configurations for AI platforms performance testing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchconf*"]
